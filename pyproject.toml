[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "irradiance-kernel"
version = "0.1.0"
description = "Comparación de kernels para clasificación de irradiancia Landsat y MODIS"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Flask==3.1.3",
  "joblib==1.5.3",
  "matplotlib==3.11.1",
  "numpy==2.5.2",
  "pandas==3.0.5",
  "scikit-learn==1.9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
